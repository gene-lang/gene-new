# The memory model is pinned in config.nims, which can see an explicit
# --mm on the command line; a pin here would stay defined beside it.

# Export the AOT boundary helpers (src/gene/aot_runtime.nim) from the
# executable's dynamic symbol table. A typed_native library opened with
# `dlopen` resolves gene_ffi_* / gene_typed_native_* from the host, so without
# this the load fails with "symbol not found in flat namespace". GNU ld reads
# the macOS spelling as `-e xport_dynamic`, a bogus entry point, so ELF
# targets use --export-dynamic.
@if macosx:
  --passL:"-Wl,-export_dynamic"
@elif not emscripten and not windows:
  --passL:"-Wl,--export-dynamic"
@end
