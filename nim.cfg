# Pin the memory model to ORC.
#
# `Value` (src/gene/types.nim) does manual reference counting through
# =copy/=sink/=dup/=destroy hooks over raw alloc0/dealloc heap objects that hold
# GC-managed fields (string/seq/Table). That scheme relies on ARC/ORC move
# semantics; a --mm:refc build would mismanage those inner fields and corrupt or
# leak memory. Keep ORC unless the value model is reworked.
--mm:orc

# Export the AOT boundary helpers (src/gene/aot_runtime.nim) from the
# executable's dynamic symbol table. A typed_native library opened with
# `dlopen` resolves gene_ffi_* / gene_typed_native_* from the host, so without
# this the load fails with "symbol not found in flat namespace".
@if not emscripten:
  --passL:"-Wl,-export_dynamic"
@end
