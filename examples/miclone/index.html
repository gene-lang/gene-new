<!doctype html>
<meta charset="utf-8">
<title>miclone</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9ec2f0; }
  #stage { display: block; width: 100vw; height: 100vh; cursor: grab; }
  #stage:active { cursor: grabbing; }
  #hud {
    position: fixed; left: 12px; top: 10px;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #0d2338; background: rgba(255,255,255,.68);
    padding: 5px 9px; border-radius: 5px; pointer-events: none;
  }
  /* The crosshair is the aim point the raycast starts from: the ray leaves the
     eye along the view direction, so what it hits is whatever is under the
     centre of the screen. */
  #aim {
    position: fixed; left: 50%; top: 50%; width: 18px; height: 18px;
    margin: -9px 0 0 -9px; pointer-events: none; opacity: .75;
  }
  #aim::before, #aim::after {
    content: ""; position: absolute; background: #0d2338;
    box-shadow: 0 0 0 1px rgba(255,255,255,.6);
  }
  #aim::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #aim::after { top: 8px; left: 0; height: 2px; width: 18px; }
  #panel {
    position: fixed; left: 50%; top: 20%; transform: translateX(-50%);
    white-space: pre; background: rgba(12,20,30,.86); color: #e8eef6;
    padding: 14px 20px; border-radius: 6px; font: 13px ui-monospace, monospace;
    pointer-events: none;
  }
  #hotbar {
    position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%);
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: nowrap; color: #0d2338; background: rgba(255,255,255,.72);
    padding: 5px 9px; border-radius: 5px; pointer-events: none;
  }
  #help {
    position: fixed; left: 12px; bottom: 10px;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #0d2338; background: rgba(255,255,255,.55);
    padding: 5px 9px; border-radius: 5px; pointer-events: none;
  }
</style>
<canvas id="stage"></canvas>
<div id="hud">building world…</div>
<div id="aim"></div>
<div id="hotbar"></div>
<div id="panel"></div>
<div id="help">drag to look · W A S D to walk · space to jump · shift to sneak · F to fly<br>click to dig · right-click to place · 1-8 or the wheel to pick a slot</div>
<script type="module">
  import { main } from "./dist/main.mjs";
  main();
</script>
